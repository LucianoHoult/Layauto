# W018 首轮审阅稿：工艺包内的逐层投影配置片段。
# 基于 tests/fixtures/w003_m1；owner#/path 引用该包指定 owner 的 JSON 字段。
# 格式名和字段拼写供实施时核定。该文档可以单独阅读；随工艺包选择和加载。
format: w018-layer-projection-example/1
classification: synthetic
units_ref: formats#/unit_scale_contract
frame_origin_nm_ref: coordinate#/coordinate_projection/frame_origin_nm

layers:
  FIN:
    projection: 1d_track
    index_axis: y
    pitch_nm_ref: physical#/fin_count_profile/fin_pitch_nm
    first_centre:
      basis: lower_edge_plus_half_width
      lower_edge_nm_ref: physical#/fin_count_profile/fin_lower_edge_offset_nm
      width_nm_ref: physical#/fin_count_profile/fin_width_nm
    index_range_inclusive: [0, 17]  # 当前样本编号窗；中心 25 至 195 nm

  LI:
    projection: 2d_cells
    # 两轴都是格边；offset 相对 frame origin。W017 显式 synthetic 样例。
    x_edges: {pitch_dbu: 20, offset_dbu: 0, cells: 8}
    y_edges: {pitch_dbu: 10, offset_dbu: 0, cells: 20}

  M1:
    projection: 2d_cells
    # PM 为跨层验收选定的测试轴，窗口同为 [0,160) × [0,200) DBU。
    # 参数刻意与 LI 不同，便于发现实现误用 LI 参数。生产数值待工艺提供。
    x_edges: {pitch_dbu: 16, offset_dbu: 0, cells: 10}
    y_edges: {pitch_dbu: 20, offset_dbu: 0, cells: 10}

  BOUNDARY: {projection: none}
  MARKER:   {projection: none}

# 以下是本审阅稿的资料清单。对应层保留原层表及几何，当前无可用的工艺网格。
# 这 10 条不是运行时投影声明。显式选定 2d_cells 后缺一根轴，属于配置错误。
# 正常测试包只装载上面 5 项；review_only 用于核对 15 层的覆盖。
review_only:
  layers_without_grid_declaration:
    POLY:    缺周期栅距和相位
    BODY_N:  缺二维格边轴
    BODY_P:  缺二维格边轴
    OD:      缺二维格边轴
    CUT:     缺二维格边轴
    CONTACT: 缺二维格边轴
    VIA0:    缺二维格边轴
    GCONTACT: 缺二维格边轴
    BTAP_N:  缺二维格边轴
    BTAP_P:  缺二维格边轴
