[project]
name = "layauto"
version = "0.2.0"
description = "Incremental FinFET layout automation framework"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
gds = ["gdstk"]
drc = ["klayout"]
test = ["pytest"]
viz = ["plotly"]
all = ["gdstk", "klayout", "pytest", "plotly"]

[tool.pytest.ini_options]
norecursedirs = ["legacy_mvp"]
