[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "layauto"
version = "0.2.0"
description = "Incremental FinFET layout automation framework"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
gds = ["gdstk"]
drc = ["klayout"]
test = ["pytest"]
dev = ["pytest", "mypy", "types-PyYAML", "build"]
viz = ["plotly"]
all = ["gdstk", "klayout", "pytest", "plotly"]

[tool.setuptools.packages.find]
include = ["layauto_v2*"]
namespaces = false

[tool.pytest.ini_options]
norecursedirs = ["legacy_mvp"]

[tool.setuptools.package-data]
layauto_v2 = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["layauto_v2/domain/codec.py", "layauto_v2/domain/evidence.py", "layauto_v2/domain/results.py", "layauto_v2/domain/acquisition.py", "layauto_v2/domain/publication.py", "layauto_v2/domain/publication_codec.py", "layauto_v2/domain/identifiers.py", "layauto_v2/domain/geometry.py", "layauto_v2/domain/regions.py", "layauto_v2/domain/local_connectivity.py", "layauto_v2/domain/channel_identity.py", "layauto_v2/domain/net_annotation.py", "layauto_v2/domain/terminal_relations.py", "layauto_v2/derive/terminal_relations.py", "layauto_v2/derive/body_relations.py", "layauto_v2/annotation/net_regions.py", "layauto_v2/state/annotation.py", "layauto_v2/derive/net_annotation.py", "layauto_v2/annotation/channel_identity.py", "layauto_v2/derive/fin_count.py", "layauto_v2/derive/channel_identity.py", "layauto_v2/state/regions.py", "layauto_v2/state/local_connectivity.py", "layauto_v2/state/layout_store.py", "layauto_v2/state/coordinate.py", "layauto_v2/state/occupancy.py", "layauto_v2/domain/circuit.py", "layauto_v2/domain/intent.py", "layauto_v2/domain/source_location.py", "layauto_v2/normalization", "layauto_v2/importers", "layauto_v2/tech", "layauto_v2/repository", "layauto_v2/tooling", "layauto_v2/pipeline.py"]
