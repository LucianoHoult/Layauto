[project]
name = "buffer-fin-resize"
version = "0.1.0"
description = "Incremental FinFET layout automation: CSP-based fin resizing"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
gds = ["gdstk"]
drc = ["klayout"]
test = ["pytest"]
all = ["gdstk", "klayout", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
