# =============================================================
# Site / run configuration — the only file you should edit
# per-experiment in production.
#
# Composes the tech bundle (drc_rules + layer_map) with the
# input/output paths for one pipeline run. Numbers live in
# the referenced YAML files; this file just points to them.
#
# Paths can be absolute or relative to this file's directory.
# `null` means "use parser default" or "skip optional input".
# =============================================================

# ---- Tech sources --------------------------------------------
tech:
  drc_rules:         drc_rules.yaml
  layer_map:         layer_map.yaml
  # Optional .layermap file from the foundry; if set, its
  # (layer_number, datatype) entries override the `gds:` field
  # of matching `layer_map.yaml` rows (other fields are kept).
  layermap_override: null

# ---- Run inputs ----------------------------------------------
inputs:
  # CDL pair drives the resize via diff_cdl()
  original_cdl:   ../dummy/fixtures/buffer_original.cdl
  modified_cdl:   ../dummy/fixtures/buffer_target.cdl
  # Calibre SVDB queries (or production-environment equivalents)
  device_query:   ../dummy/fixtures/calibre_device_query.json
  net_query:      ../dummy/fixtures/calibre_net_query.json
  # GDS-derived geometry pool (truth source for shape_pool)
  bbox_by_layer:  ../dummy/fixtures/bbox_by_layer.json
  # Optional richer JSON (full layout dict) — falls back to
  # bbox_by_layer + BOUNDARY shape if null
  layout_json:    ../dummy/fixtures/buffer_original.json
  # Target-layout JSON for the validation diff at end of pipeline
  target_json:    ../dummy/fixtures/buffer_target.json
  # Optional target GDS for shape-by-shape comparison via gdstk
  target_gds:     ../dummy/fixtures/buffer_target.gds
  # Parsed iXref middle file produced by Stage 1.5 (LVS extract).
  # Saved for later use; not consumed by build_layout_model today.
  ixref_yaml:    ../output/ixref.yaml
  # Joined net-xref middle file (schematic_name -> lvs_name -> lvs_index).
  # Saved for later use; not consumed by build_layout_model today.
  net_xref_yaml: ../output/net_xref.yaml
  # Per-device LVS-derived-shape middle file
  # (layout_inst -> {layer -> [bbox_um, ...]}).
  device_info_yaml: ../output/device_info.yaml

# ---- Run outputs ---------------------------------------------
output:
  dir:            ../output

# ---- LVS extraction (Stage 1.5) ------------------------------
# mode='dummy' (default): copy pre-staged fixtures and parse. No
#                         subprocess.
# mode='calibre': spawn `calibre -query <svdb_dir>` and stream
#                 `INSTANCE XREF WRITE` / `NET XREF WRITE` /
#                 `NET NAMES` / `DEVICE INFO <inst>` over stdin.
# CLI --lvs-mode overrides this field.
calibre:
  mode:             dummy
  svdb_dir:         ../dummy/fixtures/svdb_dir       # placeholder for dummy mode
  # Run-output paths (where the raw query results land each run).
  ixref_temp:       ../output/iXref.temp
  nxref_temp:       ../output/nXref.temp
  net_names_txt:    ../output/net_names.txt
  # Per-device DEVICE INFO outputs land here as device_info_<inst>.txt.
  device_info_dir:  ../output
  # Dummy sources (used only when mode=dummy).
  dummy_ixref:      ../dummy/fixtures/iXref.temp
  dummy_nxref:      ../dummy/fixtures/nXref.temp
  dummy_net_names:  ../dummy/fixtures/net_names.txt
  # Directory containing dummy device_info_<inst>.txt files
  # (one per layout instance the dummy iXref names).
  dummy_device_info_dir: ../dummy/fixtures
  timeout_s:        300

