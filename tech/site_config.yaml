# =============================================================
# Site / run configuration — the only file you should edit
# per-experiment in production.
#
# Composes the tech bundle (drc_rules + layer_map) with the
# input/output paths for one pipeline run. Numbers live in
# the referenced YAML files; this file just points to them.
#
# Paths can be absolute or relative to this file's directory.
# `null` means "use parser default" or "skip optional input".
# =============================================================

# ---- Tech sources --------------------------------------------
tech:
  drc_rules:         drc_rules.yaml
  layer_map:         layer_map.yaml
  # Optional .layermap file from the foundry; if set, its
  # (layer_number, datatype) entries override the `gds:` field
  # of matching `layer_map.yaml` rows (other fields are kept).
  layermap_override: null

# ---- Run inputs ----------------------------------------------
inputs:
  # CDL pair drives the resize via diff_cdl()
  original_cdl:   ../dummy/fixtures/buffer_original.cdl
  modified_cdl:   ../dummy/fixtures/buffer_target.cdl
  # Calibre SVDB queries (or production-environment equivalents)
  device_query:   ../dummy/fixtures/calibre_device_query.json
  net_query:      ../dummy/fixtures/calibre_net_query.json
  # Optional: SVDB INSTANCE XREF dump (raw .temp or parsed .yaml).
  # Used to translate SVDB-extracted device names back to schematic
  # names during apply_lvs_overlay. Null = skip translation
  # (production runs that share names between schematic and SVDB).
  ixref:          ../dummy/fixtures/iXref.temp
  # GDS-derived geometry pool (truth source for shape_pool)
  bbox_by_layer:  ../dummy/fixtures/bbox_by_layer.json
  # Optional richer JSON (full layout dict) — falls back to
  # bbox_by_layer + BOUNDARY shape if null
  layout_json:    ../dummy/fixtures/buffer_original.json
  # Target-layout JSON for the validation diff at end of pipeline
  target_json:    ../dummy/fixtures/buffer_target.json
  # Optional target GDS for shape-by-shape comparison via gdstk
  target_gds:     ../dummy/fixtures/buffer_target.gds

# ---- Run outputs ---------------------------------------------
output:
  dir:            ../output

# ---- Calibre integration ------------------------------------
# Production knobs for the SVDB query / xref extraction step.
# `dummy_mode: true` short-circuits the actual `calibre -query`
# call and reads pre-baked fixtures from `dummy_fixture_dir`,
# which is what every test + the MVP pipeline uses today.
# Flipping `dummy_mode: false` and pointing `svdb_dir` at a real
# SVDB is the only edit needed when moving to production.
calibre:
  dummy_mode:           true
  # SVDB database directory. In dummy_mode this is unused, but
  # the path is still validated by `load_site_config`.
  svdb_dir:             /local/svdb_dir
  # Top cell name to query inside the SVDB (the `BUFLVT`-style
  # token in iXref headers). Falls back to the cell parsed from
  # `inputs.original_cdl` if null.
  cell_name:            null
  # Where to look for pre-baked fixture artifacts when
  # dummy_mode is true. Production runs ignore this.
  dummy_fixture_dir:    ../dummy/fixtures
  # Instance Cross Reference (`INSTANCE XREF WRITE`) — pairs
  # each schematic device name with its SVDB-extracted name.
  ixref:
    # Output file. Pattern tokens get expanded at write time:
    #   {ts}    → strftime(timestamp_format)
    #   {cell}  → calibre.cell_name
    # Resolved relative to this site_config's directory.
    output:             ../output/iXref_{cell}_{ts}.temp
    timestamp_format:   "%Y%m%d_%H%M%S"
    # Parsed-form middle file consumed by `apply_lvs_overlay`.
    # If null, the parser writes alongside `output` with `.yaml`.
    parsed_yaml:        ../output/lvs_device_xref.yaml

