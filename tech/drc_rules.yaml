# DRC rule parameters for dummy 7nm-class FinFET process.
# All dimensions in nanometers (nm).
#
# Severity levels:
#   critical    - Must pass; violation blocks tapeout
#   recommended - Should pass; waived only with justification
#   advisory    - Informational; best-practice guidance
#
# In production, replace with foundry DRM values.

rules:
  spacing:
    - name: LI_min_spacing
      layer: LI
      type: same_layer_min_space
      value_nm: 17
      severity: critical

    - name: M1_min_spacing
      layer: M1
      type: same_layer_min_space
      value_nm: 16
      severity: critical

    - name: VIA0_min_spacing
      layer: VIA0
      type: same_layer_min_space
      value_nm: 20
      severity: critical

  enclosure:
    - name: VIA0_enc_by_LI
      via_layer: VIA0
      metal_layer: LI
      enc_x_nm: 1
      enc_y_nm: 5
      severity: critical

    - name: VIA0_enc_by_M1
      via_layer: VIA0
      metal_layer: M1
      enc_x_nm: 5
      enc_y_nm: 1
      severity: critical
